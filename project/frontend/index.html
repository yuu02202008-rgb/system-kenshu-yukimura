<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Library — 本のコレクション</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="/frontend/assets/js/app.js" defer></script>
  <style>[hidden]{display:none!important} [aria-invalid="true"]{border:2px solid #b91c1c} :focus-visible{outline:3px solid #0f766e;outline-offset:3px}</style>
</head>
<body class="min-h-screen bg-stone-50 text-slate-900">
<header class="border-b border-stone-200 bg-white">
  <nav aria-label="メイン" class="max-w-5xl mx-auto px-6 py-5 flex items-center justify-between gap-4">
    <a href="/" class="font-bold text-xl tracking-tight">Book Library<span class="text-teal-700">.</span></a>
    <a href="#collection" class="text-sm text-slate-600">コレクション</a>
  </nav>
</header>
<main class="max-w-5xl mx-auto px-6 py-10 md:py-16">
  <p class="text-teal-700 text-sm font-semibold tracking-widest">MY READING SHELF</p>
  <div class="mt-3 flex flex-col sm:flex-row sm:items-end justify-between gap-6">
    <div><h1 class="text-3xl md:text-5xl font-bold tracking-tight">本との出会いを、ここに。</h1><p class="mt-4 text-slate-600">お気に入りの一冊をコレクションに追加しましょう。</p></div>
    <button id="add-button" type="button" aria-expanded="false" aria-controls="book-form" class="shrink-0 rounded-lg bg-teal-800 px-6 py-3 font-semibold text-white hover:bg-teal-900">＋ 本を追加</button>
  </div>
  <p class="mt-6 text-sm text-slate-500">練習用の画面です。追加・削除はこの画面内だけに反映され、再読み込みで元に戻ります。</p>
  <form id="book-form" hidden novalidate class="mt-8 rounded-xl border border-stone-200 bg-white p-6">
    <h2 class="text-xl font-bold mb-5">新しい本を追加</h2>
    <div class="grid gap-5 sm:grid-cols-2">
      <div><label for="title" class="block font-medium">タイトル（必須）</label><input id="title" name="title" required maxlength="255" aria-describedby="title-error" class="mt-2 w-full border border-slate-300 rounded-lg p-3"><p id="title-error" class="mt-1 text-sm text-red-700"></p></div>
      <div><label for="author" class="block font-medium">著者（必須）</label><input id="author" name="author" required maxlength="255" aria-describedby="author-error" class="mt-2 w-full border border-slate-300 rounded-lg p-3"><p id="author-error" class="mt-1 text-sm text-red-700"></p></div>
      <div><label for="year" class="block font-medium">出版年（必須）</label><input id="year" name="year" type="number" min="0" max="9999" step="1" required aria-describedby="year-error" class="mt-2 w-full border border-slate-300 rounded-lg p-3"><p id="year-error" class="mt-1 text-sm text-red-700"></p></div>
      <div><label for="genre" class="block font-medium">ジャンル（必須）</label><input id="genre" name="genre" required maxlength="100" aria-describedby="genre-error" class="mt-2 w-full border border-slate-300 rounded-lg p-3"><p id="genre-error" class="mt-1 text-sm text-red-700"></p></div>
    </div>
    <button type="submit" class="mt-6 rounded-lg bg-teal-800 px-6 py-3 text-white font-semibold">コレクションに追加</button>
  </form>
  <section id="collection" class="mt-12" aria-labelledby="collection-heading">
    <div class="flex justify-between items-center border-b border-stone-200 pb-4"><h2 id="collection-heading" class="text-xl font-bold">コレクション</h2><span id="book-count" class="text-sm text-slate-500"></span></div>
    <p id="notice" role="status" aria-live="polite" class="mt-4 text-sm text-teal-800"></p>
    <p id="empty" hidden class="py-12 text-center text-slate-500">本がありません。「本を追加」から登録してください。</p>
    <ul id="book-list" class="mt-6 grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></ul>
  </section>
</main>
<footer class="max-w-5xl mx-auto px-6 py-8 text-sm text-slate-500 border-t border-stone-200">Book Library · 読書の記録</footer>
</body></html>
