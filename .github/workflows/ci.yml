name: Week 1 through 7 checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Create temporary local database credentials
        run: |
          {
            printf 'MYSQL_ROOT_PASSWORD=%s\n' "$(openssl rand -hex 24)"
            printf 'MYSQL_DATABASE=training\n'
            printf 'MYSQL_USER=training_user\n'
            printf 'MYSQL_PASSWORD=%s\n' "$(openssl rand -hex 24)"
          } > .env

      - name: Build and start PHP and MySQL
        run: docker compose up --build --wait --wait-timeout 180 webserver database

      - name: Load three sample books
        run: |
          docker compose exec -T database sh -c 'mysql --default-character-set=utf8mb4 -uroot -p"$MYSQL_ROOT_PASSWORD" training' < project/sql/schema.sql
          docker compose exec -T database sh -c 'mysql --default-character-set=utf8mb4 -uroot -p"$MYSQL_ROOT_PASSWORD" training' < project/sql/seed.sql

      - name: Check PHP syntax and run Week 1 exercises
        run: |
          set -euo pipefail
          find project week-01 week-03 -name '*.php' -print | while IFS= read -r source; do
            case "$source" in
              project/*) container_path="/var/www/html/${source#project/}" ;;
              week-01/*|week-03/*) container_path="/workspace/$source" ;;
            esac
            docker compose exec -T webserver php -l "$container_path" </dev/null
          done
          docker compose exec -T webserver php /workspace/week-01/tasks/variables-and-types.php
          docker compose exec -T webserver php /workspace/week-01/tasks/conditionals-loops.php
          docker compose exec -T webserver php /workspace/week-01/tasks/functions-arrays.php
          docker compose exec -d webserver php -S 0.0.0.0:8001 -t /workspace/week-01/tasks

      - name: Check Book Library, form and CRUD API
        run: python3 project/tests/smoke.py

      - name: Run the Postman collection with Newman
        run: npx --yes newman@6.2.2 run project/postman/Book-Library.postman_collection.json --bail

      - name: Test frontend against the real API
        run: |
          npm ci
          npm test

      - name: Record container information and Git conflict exercise
        run: |
          mkdir -p evidence
          { docker compose exec -T webserver php -v; docker compose exec -T webserver php -m; docker compose exec -T webserver ls; } > evidence/container-info.txt
          bash week-06/tasks/conflict-demo.sh > evidence/conflict-demo.txt

      - name: Verify database failure returns a safe 500 response
        run: |
          docker compose stop database
          python3 - <<'PYCODE'
          import json, urllib.request, urllib.error
          try:
              urllib.request.urlopen('http://127.0.0.1:8000/api/books', timeout=30)
              raise AssertionError('Expected HTTP 500')
          except urllib.error.HTTPError as error:
              assert error.code == 500
              body = json.loads(error.read())
              assert 'error' in body and 'password' not in str(body).lower()
              print('Database unavailable: safe JSON 500 passed')
          PYCODE

      - name: Upload execution evidence
        uses: actions/upload-artifact@v4
        with:
          name: week-06-execution-evidence
          path: evidence/

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color webserver database

      - name: Remove temporary containers and database
        if: always()
        run: docker compose down -v
